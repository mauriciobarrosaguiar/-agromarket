<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b3d25" />
  <title>AgroGestão sem conexão</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#17231b;background:#f4f7f4;font-family:Arial,sans-serif}.card{width:min(420px,100%);padding:32px 26px;border:1px solid #dbe5dd;border-radius:24px;background:#fff;text-align:center;box-shadow:0 20px 55px rgba(10,61,37,.12)}.logo{width:76px;height:76px;display:grid;place-items:center;margin:0 auto 20px;border-radius:22px;color:#fff;background:#0b3d25;font-family:Georgia,serif;font-size:30px;font-weight:800}.card h1{margin:0 0 10px;font-family:Georgia,serif;font-size:30px}.card p{margin:0;color:#68736c;line-height:1.55}.card button{width:100%;min-height:50px;margin-top:24px;border:0;border-radius:12px;color:#fff;background:#0d4b2d;font-weight:800;font-size:15px}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">Ag</div>
    <h1>Sem conexão</h1>
    <p>Conecte o celular à internet para carregar seus dados do AgroGestão.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
