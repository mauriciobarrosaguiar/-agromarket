<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b3d25" />
  <title>AgroMarket offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f6ef;color:#17301f;font-family:Arial,sans-serif}.card{width:min(440px,100%);padding:30px;border:1px solid #d8e2d9;border-radius:20px;background:#fff;text-align:center;box-shadow:0 18px 45px rgba(15,62,34,.09)}.icon{font-size:52px}h1{margin:10px 0 8px;font-size:28px}p{margin:0 0 22px;color:#68756c;line-height:1.55}.btn{min-height:50px;display:grid;place-items:center;border:0;border-radius:12px;color:#fff;background:#12613b;font-weight:800;text-decoration:none}.hint{margin-top:14px;font-size:12px;color:#7b867e}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">🌱</div>
    <h1>Você está sem internet</h1>
    <p>O AgroGestão e a Incubação funcionam offline depois que forem abertos pelo menos uma vez com internet neste aparelho.</p>
    <a class="btn" href="/painel/gestao">Abrir AgroGestão</a>
    <div class="hint">Quando a conexão voltar, os registros pendentes serão enviados ao banco.</div>
  </main>
</body>
</html>
